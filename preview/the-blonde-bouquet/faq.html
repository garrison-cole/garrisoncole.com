<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ · The Blonde Bouquet</title>
<meta name="description" content="Luxury wedding florals designed in Auburn, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&amp;family=Figtree:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6F0}
.scal{-webkit-mask:radial-gradient(circle 14px at 14px 14px,#000 95%,#0000) 0 0/28px 28px round,linear-gradient(#000 0 0) center/calc(100% - 28px) calc(100% - 28px) no-repeat;mask:radial-gradient(circle 14px at 14px 14px,#000 95%,#0000) 0 0/28px 28px round,linear-gradient(#000 0 0) center/calc(100% - 28px) calc(100% - 28px) no-repeat}
.bu{position:relative;z-index:2;height:18px;margin-top:-18px;background:radial-gradient(circle 9px at 9px 18px,var(--c) 95%,#0000) 0 0/18px 18px repeat-x}
.bd{position:relative;z-index:2;height:18px;margin-bottom:-18px;background:radial-gradient(circle 9px at 9px 0,var(--c) 95%,#0000) 0 0/18px 18px repeat-x}
.shd{filter:drop-shadow(0 18px 38px rgba(70,45,35,.14))}
.wv{position:absolute;left:0;right:0;height:26px;pointer-events:none;z-index:3;background-repeat:repeat-x;background-size:220px 26px}
.wv-t{top:-1px}
.wv-bl{background-image:url(assets/wave-blush.svg)}
.fr{background-color:#F8EFE4;background-image:url(assets/stripe-rose.svg);background-repeat:repeat;background-size:120px 480px;background-position:center top}
.fr-petal{background-image:url(assets/stripe-petal.svg)}.fr-blush{background-image:url(assets/stripe-blush.svg)}.fr-raspberry{background-image:url(assets/stripe-raspberry.svg)}
a{color:#A3134F}a:hover{color:#7A0E3B}
.nv{color:#1F1B19;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:12px 0}
.nv:hover{color:#A3134F}
.btn{transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.btn:hover{background-color:#1F1B19 !important;color:#FFFFFF !important;border-color:#1F1B19 !important}
.tl{color:#1F1B19;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid #B8955A;padding-bottom:6px;transition:color .3s,border-color .3s}
.tl:hover{color:#A3134F;border-color:#A3134F}
.ft a{color:#EFE6DB;text-decoration:none}.ft a:hover{color:#F29BC0}
.q{transition:color .3s}.q:hover{color:#A3134F !important}
.q:focus-visible{outline:2px solid #A3134F;outline-offset:4px}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ans{animation:open .5s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: no-preference){
.in1{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .2s both}
.in2{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .45s both}
.in3{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .7s both}
@supports (animation-timeline: view()){
.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
}}
</style>
<style>html{scroll-behavior:smooth}#dc-root{min-height:100vh}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: 'Figtree', system-ui, sans-serif; font-weight: 400; color: #1F1B19; background: #FAF6F0; min-height: 100vh;">

<header style="background: #FAF6F0; border-bottom: 1px solid #E3D6C3;">
<div style="max-width: 1320px; margin: 0 auto; padding: 18px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 32px;">

</nav>
</div>

<section style="max-width: 1240px; margin: 0 auto; padding: 110px 28px 140px; display: flex; flex-wrap: wrap; gap: 72px; align-items: flex-start;">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 28px;">
<p class="in1" style="margin: 0; font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: #6A605A; font-weight: 500;">Questions</p>
<h1 class="in2" style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(50px, 6vw, 88px); line-height: 0.98; letter-spacing: 0.04em; text-transform: uppercase;">Good <em style="display: block; text-transform: none; letter-spacing: 0; color: {{accent}};">to know</em></h1>
<p class="in3" style="margin: 0; font-size: 16px; line-height: 1.85; color: #4A413C; font-weight: 300;">The things couples ask us most. Anything else, ask La Raye directly.</p>
<div class="in3" style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 10px;"><img src="assets/h07.jpg" alt="Couple kissing in a garden, the bride holding a bright bouquet" style="width: 100%; height: 400px; object-fit: cover; display: block; border-radius: 400px 400px 0 0;"></div>
<a class="tl in3" href="quote.html" style="align-self: flex-start;">Ask a question</a>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #C9A97A;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="10">
<div style="border-bottom: 1px solid #C9A97A;">
<h2 style="margin: 0;">
<button type="button" class="q" onClick="{{it.toggle}}" aria-expanded="{{it.open}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 24px; background: none; border: 0; padding: 28px 0; cursor: pointer; text-align: left; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 23px; line-height: 1.3; color: #1F1B19; min-height: 44px;">
<span style="display: flex; gap: 20px; align-items: baseline;"><span style="font-style: italic; font-size: 17px; color: {{accent}}; min-width: 36px;">{{it.num}}</span>{{it.q}}</span>
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border: 1px solid #C9A97A; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: 'Figtree', sans-serif; font-size: 18px; font-weight: 300;">{{it.icon}}</span>
</button>
</h2>
<sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
<p class="ans" style="margin: 0; padding: 0 60px 30px 56px; font-size: 16px; line-height: 1.85; color: #4A413C; font-weight: 300;">{{it.a}}</p>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section class="fr fr-{{stripe}}" style="padding: 72px 28px;">
<div style="background: #FFFFFF; padding: 110px 40px; outline: 1px solid #E2CFB0; outline-offset: -18px; max-width: 1100px; margin: 0 auto; box-sizing: border-box;">
<div class="rv" style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; align-items: center; text-align: center;">
<h2 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(40px, 5vw, 72px); line-height: 1; letter-spacing: 0.04em; text-transform: uppercase;">Still wondering? <em style="display: block; text-transform: none; letter-spacing: 0; color: {{accent}};">Let's talk.</em></h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: center;">
<a class="btn" href="quote.html" style="border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 18px 36px; font-size: 11px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase;">Request a Quote</a>
<a class="tl" href="investment.html">Open the estimator</a>
</div>
</div>
</div>
</section>

<div style="position: relative; height: 0;"><div class="wv wv-t wv-bl" aria-hidden="true"></div></div>
<footer class="ft" style="background: #1F1B19; color: #EFE6DB; padding: 96px 28px 40px;">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 64px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 56px; align-items: flex-start;">
<div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 22px;">
<img src="assets/tbb2-logo-stacked-light.svg" alt="The Blonde Bouquet Floral Design, Auburn, California" style="width: 300px; height: auto; display: block;">

</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 48px 80px;">
<div style="display: flex; flex-direction: column; gap: 14px; font-size: 14px;">

</div>
<div style="display: flex; flex-direction: column; gap: 14px; font-size: 14px;">
<span style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #C9A97A;">Say hello</span>
<a href="quote.html">Request a Quote</a><a href="mailto:theblondebouquet@gmail.com">theblondebouquet@gmail.com</a><a href="https://www.instagram.com/the_blonde_bouquet">Instagram</a><a href="https://www.yelp.com/biz/the-blonde-bouquet-roseville-2">Yelp</a>
</div>
</nav>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid rgba(201, 169, 122, 0.4); padding-top: 26px; font-size: 12px; letter-spacing: 0.08em; color: #A89C90;">
<span>© 2026 The Blonde Bouquet Floral Design · Auburn, California</span>
<span style="display: flex; gap: 28px;"><a href="portfolio.html">Photo Credits</a><a href="about.html">Workshops</a></span>
</div>
</div>
</footer>

</div>
</template>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#A3134F';
    const qa = [
      { q: 'How far ahead should we reach out?', a: 'For peak season (April through October), most couples reach out 9 to 14 months ahead. Off-season and intimate weddings can often be reserved 4 to 6 months out. A la carte orders need about three weeks.' },
      { q: 'Do you have a minimum?', a: 'Full-service weddings begin at $8,000 in florals. Below that, our a la carte collection is a lovely fit. Our estimator on the Investment page gives you a real number in about a minute.' },
      { q: 'Do you travel?', a: 'Yes. We are based in Auburn and design weddings across Placer County, Sacramento, Lake Tahoe, Napa, Sonoma and the Bay Area. Travel beyond [X] miles carries a travel fee, which we include in your proposal.' },
      { q: 'What does the proposal include?', a: 'Sketches, a color palette, inspiration imagery and line-item pricing for every piece, so you can see exactly where your investment goes and adjust it before you sign.' },
      { q: 'How do we reserve our date?', a: 'A signed agreement and a [25%] retainer reserve your date. We finalize counts and details at a consultation about a month out, when the balance is due.' },
      { q: 'Can you work with our planner?', a: 'Always. We collaborate with planners and coordinators all the time and are happy to take direction from them on timing and logistics.' },
      { q: 'Do you design events other than weddings?', a: 'Weddings are our focus, and we also design for rehearsal dinners, vow renewals, milestone celebrations and select private events.' },
      { q: 'Do you provide vases, arches and candles?', a: 'Vases and containers are included in your design, and you keep them. Arches, stands and structural pieces are ours for the day. [Confirm candle policy.]' },
      { q: 'What happens to the flowers after?', a: 'They are yours. Many couples send arrangements home with family or donate them. Ask us and we can help plan it.' },
      { q: 'Do you work with all couples?', a: 'Yes. Love is for all, and every couple is welcome here.' }
    ];
    const roman = ['i.', 'ii.', 'iii.', 'iv.', 'v.', 'vi.', 'vii.', 'viii.', 'ix.', 'x.'];
    const openIdx = this.state.open;
    return {
      accent,
      stripe: this.props.stripe ?? 'rose',
      items: qa.map((x, k) => ({
        ...x,
        num: roman[k],
        open: openIdx === k,
        icon: openIdx === k ? '−' : '+',
        toggle: () => this.setState({ open: openIdx === k ? -1 : k })
      }))
    };
  }
}

DCLite.mount(Component, {"stripe": "rose", "accent": "#A3134F"});</script>
</body>
</html>
