<p class="in3" style="margin: 0; font-size: 17px; line-height: 1.9; color: #4A413C; font-weight: 300;">Before flowers, there was fashion. I spent fourteen years in visual merchandising for Anthropologie and Nordstrom, building windows and displays up and down California from L.A. to San Francisco. I was always the one sneaking flowers into the windows. In 2014 I made the flowers the job.</p>

<li style="padding: 15px 0; border-top: 1px solid #C9A97A; display: flex; gap: 16px;"><span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-style: italic; color: {{accent}}; min-width: 22px;">ii.</span>I answer emails. Quickly. Ask anyone who has worked with me.</li>
