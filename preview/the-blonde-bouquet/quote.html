<section style="max-width: 1240px; margin: 0 auto; padding: 110px 28px 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 80px; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 28px;">
<p class="in1" style="margin: 0; font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: #6A605A; font-weight: 500;">Request a Quote</p>
<h1 class="in2" style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(50px, 6.6vw, 98px); line-height: 0.98; letter-spacing: 0.04em; text-transform: uppercase;">Tell us about <em style="display: block; text-transform: none; letter-spacing: 0; color: {{accent}};">your day</em></h1>
<p class="in3" style="margin: 0; font-size: 17px; line-height: 1.85; color: #4A413C; font-weight: 300; max-width: 520px;">La Raye reads every inquiry personally and replies within two business days. If your date is open, we'll set up a consultation to talk through what you're picturing. Prefer email? <a href="mailto:theblondebouquet@gmail.com">theblondebouquet@gmail.com</a></p>
</div>
<div class="in3" style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 12px;">
<div class="zm" style="border-radius: 400px 400px 0 0;"><img src="assets/ig_greenhouse.jpg" alt="Couple in front of a glass greenhouse, the bride holding an ivory bouquet" style="width: 100%; height: 560px; object-fit: cover; display: block;"></div>
</div>
</section>

<section style="background: #F4E6E1; padding: 80px max(28px, calc((100% - 1184px) / 2)) 120px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 32px;">

<sc-if value="{{showForms}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 32px;">
<div role="group" aria-label="What are you planning?" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px;">
<button type="button" class="opt" onClick="{{pickWedding}}" aria-pressed="{{isWedding}}" style="{{wedCard}}">
<span style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #6A605A;">i.</span>
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 26px; line-height: 1.15;">Full wedding or event</span>
<span style="font-size: 14px; line-height: 1.6; color: #4A413C; font-weight: 300;">Ceremony, reception and installations.</span>
</button>
<button type="button" class="opt" onClick="{{pickAlc}}" aria-pressed="{{isAlc}}" style="{{alcCard}}">
<span style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #6A605A;">ii.</span>
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 26px; line-height: 1.15;">A la carte order</span>
<span style="font-size: 14px; line-height: 1.6; color: #4A413C; font-weight: 300;">A bouquet, boutonnieres or a few pieces.</span>
</button>
</div>

<sc-if value="{{isWedding}}" hint-placeholder-val="{{ true }}">
<form class="f" aria-label="Full wedding or event quote" style="background: #FFFFFF; outline: 1px solid #E2CFB0; outline-offset: -18px; padding: clamp(36px, 5vw, 64px); display: flex; flex-direction: column; gap: 34px;">
<h2 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 36px;">Your <em style="color: {{accent}};">wedding</em></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 28px 32px;">
<label style="display: flex; flex-direction: column; gap: 6px;">Your name *<input type="text" autocomplete="name" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Partner's name<input type="text"></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Email *<input type="email" autocomplete="email" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Phone *<input type="tel" autocomplete="tel" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Wedding date *<input type="date" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Venue and city *<input type="text" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Type of event
<select><option>Wedding</option><option>Elopement or intimate wedding</option><option>Vow renewal</option><option>Celebration or party</option><option>Corporate</option><option>Other</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Guest count
<select><option>Under 50</option><option>50 to 100</option><option>100 to 150</option><option>150 to 200</option><option>200 to 300</option><option>300+</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1;">Floral investment *
<select required=""><option value="">Choose a range</option><option>$8,000 to $12,000</option><option>$12,000 to $20,000</option><option>$20,000 to $30,000</option><option>$30,000 to $50,000</option><option>$50,000+</option><option>I used the estimator (add your number below)</option></select></label>
</div>
<fieldset style="margin: 0; padding: 0; border: 0;">
<legend style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; color: #4A413C; padding: 0; margin-bottom: 14px;">Is your date confirmed?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<label class="chip"><input type="radio" name="w-confirmed">Yes, it's booked</label>
<label class="chip"><input type="radio" name="w-confirmed">Still deciding</label>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0;">
<legend style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; color: #4A413C; padding: 0; margin-bottom: 14px;">What are you picturing?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<label class="chip"><input type="checkbox">Bridal party flowers</label>
<label class="chip"><input type="checkbox">Ceremony arch or installation</label>
<label class="chip"><input type="checkbox">Aisle or meadow installation</label>
<label class="chip"><input type="checkbox">Reception centerpieces</label>
<label class="chip"><input type="checkbox">Hanging installation</label>
<label class="chip"><input type="checkbox">Flower wall</label>
<label class="chip"><input type="checkbox">Cake and bar flowers</label>
<label class="chip"><input type="checkbox">The full experience</label>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0;">

<label class="chip"><input type="checkbox">Ivory and timeless</label>
<label class="chip"><input type="checkbox">Bright and colorful</label>
<label class="chip"><input type="checkbox">Soft and romantic</label>
<label class="chip"><input type="checkbox">Wild and garden-gathered</label>
<label class="chip"><input type="checkbox">Bold and dramatic</label>
<label class="chip"><input type="checkbox">Help me decide</label>
</div>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 10px;">Tell us about your day
<textarea rows="5" placeholder="Colors, inspiration, your estimator number, what matters most to you"></textarea></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 28px 32px;">

<label style="display: flex; flex-direction: column; gap: 6px;">Planner or coordinator<input type="text" placeholder="Name and company"></label>
<label style="display: flex; flex-direction: column; gap: 6px;">How did you find us?
<select><option>Instagram</option><option>Google</option><option>Venue referral</option><option>Planner referral</option><option>Friend or past couple</option><option>The Knot or WeddingWire</option><option>Other</option></select></label>
</div>
<button type="button" class="btn" onClick="{{submit}}" style="align-self: flex-start; border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; padding: 19px 40px; border-radius: 0; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; cursor: pointer; min-height: 52px;">Send my inquiry</button>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 28px 32px;">
<label style="display: flex; flex-direction: column; gap: 6px;">Your name *<input type="text" autocomplete="name" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Email *<input type="email" autocomplete="email" required=""></label>
<label style="display: flex; flex-direction: column; gap: 6px;">Phone *<input type="tel" autocomplete="tel" required=""></label>

<fieldset style="margin: 0; padding: 0; border: 0;">

<label class="chip"><input type="checkbox">Boutonnieres</label>
<label class="chip"><input type="checkbox">Corsages</label>

</form>

<img src="assets/tbb2-mark.svg" alt="" aria-hidden="true" style="width: 76px; height: 76px; display: block;">
<p style="margin: 0; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: #6A605A; font-weight: 500;">Thank you</p>

<p style="margin: 0; font-size: 14px; line-height: 1.8; color: #4A413C; font-weight: 300;">Wondering about investment first? <a href="investment.html">Try the estimator.</a></p>
<div style="border: 1px solid #B8955A; border-radius: 50%; padding: 10px;"><img src="assets/s01.jpg" alt="La Raye in a sun hat holding a bright bouquet" style="width: 100%; height: 380px; object-fit: cover; display: block; border-radius: 50%;"></div>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { form: null, sent: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#A3134F';
    const form = this.state.form ?? (this.props.startWith ?? 'wedding');
    const sent = this.state.sent;
    const card = (on) => 'text-align:left;display:flex;flex-direction:column;gap:10px;padding:26px 26px;border-radius:0;cursor:pointer;font:inherit;color:#1F1B19;min-height:44px;background:' + (on ? '#FFFDF9' : 'transparent') + ';border:1px solid ' + (on ? accent : '#D9C9AE') + ';box-shadow:' + (on ? 'inset 0 0 0 1px ' + accent : 'none') + ';';
    return {
      accent,
      sent,
      showForms: !sent,
      isWedding: form === 'wedding',
      isAlc: form === 'alacarte',
      wedCard: card(form === 'wedding'),
      alcCard: card(form === 'alacarte'),
      pickWedding: () => this.setState({ form: 'wedding' }),
      pickAlc: () => this.setState({ form: 'alacarte' }),
      submit: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}

DCLite.mount(Component, {"accent": "#A3134F", "startWith": "wedding"});</script>
