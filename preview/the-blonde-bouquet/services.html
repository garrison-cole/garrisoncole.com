  bud:      { name: 'Bud vase', low: 15, high: 35, max: 120 },
  frog:     { name: 'Flower frog centerpiece', low: 75, high: 125, max: 40 },
  compote:  { name: 'Compote centerpiece', low: 120, high: 250, max: 40 },
  tall:     { name: 'Tall centerpiece', low: 300, high: 500, max: 40 },
  accent:   { name: 'Welcome, bar or accent piece', low: 120, high: 275, max: 12 },
  hanging:  { name: 'Hanging floral installation', low: 3000, high: 7000, plus: true },
  garland:  { name: 'Full floral garland', low: 95, high: 225, unit: 'ft', max: 200, step: 5 },
  circle:   { name: 'Aisle circle platform', low: 3000, high: 5000, plus: true }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('tbb-calc') || 'null'); } catch (e) {}
    this.state = Object.assign({ q: { bridal: 1, maids: 0, bouts: 0, corsages: 0, meadows: 0, pillars: 0, bud: 0, frog: 0, compote: 0, tall: 0, accent: 0, garland: 0 }, arch: 'none', impact: { hanging: false, circle: false }, rent: false, email: '', msg: '' }, saved || {}, { msg: '' });
  }
  renderVals() {
    const p = this.props;
    const accent = p.accent ?? '#A3134F';
    const P = TBB_PRICING;
    const s = this.state;
    const money = (v) => '$' + Math.round(v).toLocaleString('en-US');
    const rng = (lo, hi, plus) => (lo === hi ? money(lo) : money(lo) + ' to ' + money(hi)) + (plus ? '+' : '');
    const each = (k) => { const it = P[k]; return rng(it.low, it.high, it.plus) + (it.unit === 'ft' ? ' per ft.' : ' each'); };

    const lines = []; let lo = 0, hi = 0, plus = false;
    const add = (k, qty) => {
      if (!qty) return; const it = P[k];
      lo += it.low * qty; hi += it.high * qty; if (it.plus) plus = true;
      const label = it.unit === 'ft' ? it.name + ', ' + qty + ' ft' : (qty > 1 ? it.name + ' × ' + qty : it.name);
      lines.push({ label, amount: rng(it.low * qty, it.high * qty, it.plus) });
    };
    ['bridal', 'maids', 'bouts', 'corsages'].forEach((k) => add(k, s.q[k]));
    if (s.arch !== 'none') add(s.arch, 1);
    ['meadows', 'pillars', 'bud', 'frog', 'compote', 'tall', 'accent'].forEach((k) => add(k, s.q[k]));
    if (s.impact.hanging) add('hanging', 1);
    add('garland', s.q.garland);
    if (s.impact.circle) add('circle', 1);
    const f = P.feePercent / 100;
    const flo = Math.round(lo * f), fhi = Math.round(hi * f);
    const empty = lines.length === 0;
    const sub = empty ? '$0' : rng(lo, hi, plus);
    const fee = empty ? '$0' : rng(flo, fhi, plus);
    const total = empty ? '$0' : rng(lo + flo, hi + fhi, plus);
    const notes = 'Floral subtotal: ' + sub + '\nDesign & Setup Fee (25%): ' + fee + '\nTax not included.' + (s.rent ? '\nRent ceremony pillars: quoted in proposal.' : '');
    const text = 'MY FLORAL ESTIMATE · The Blonde Bouquet\n\n' + (empty ? '(No pieces chosen yet)' : lines.map((l) => l.label + ': ' + l.amount).join('\n')) + '\n\n' + notes + '\nEstimated total: ' + total;
    const isDefault = Object.keys(s.q).every((k) => s.q[k] === (k === 'bridal' ? 1 : 0)) && s.arch === 'none' && !s.impact.hanging && !s.impact.circle && !s.rent;
    const estObj = { total, lines: lines.map((l) => l.label + ': ' + l.amount), notes };
    try {
      localStorage.setItem('tbb-calc', JSON.stringify({ q: s.q, arch: s.arch, impact: s.impact, rent: s.rent, email: s.email }));
      if (isDefault || empty) localStorage.removeItem('tbb-estimate');
      else localStorage.setItem('tbb-estimate', JSON.stringify(estObj));
    } catch (e) {}

    const card = (on) => 'text-align:left;display:flex;flex-direction:column;gap:10px;padding:22px 20px;cursor:pointer;font:inherit;color:#1F1B19;min-height:44px;border-radius:0;background:' + (on ? '#FAF6F0' : '#FFFFFF') + ';border:1px solid ' + (on ? accent : '#D9C9AE') + ';box-shadow:' + (on ? 'inset 0 0 0 1px ' + accent : 'none') + ';';
    const setQ = (k, v) => { const it = P[k]; const step = it.step || 1; this.setState({ q: Object.assign({}, s.q, { [k]: Math.max(0, Math.min(it.max, v)) }) }); };
    const vals = {
      stripe: p.stripe ?? 'rose',
      accent,
      lines, empty, sub, fee, total,
      rent: s.rent,
      selfEmail: s.email,
      msg: s.msg,
      setEmail: (e) => this.setState({ email: e.target.value }),
      submitEst: () => {
        try { if (!empty) localStorage.setItem('tbb-estimate', JSON.stringify(estObj)); } catch (e) {}
      },
      mailSelf: () => {
        const em = (s.email || '').trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { this.setState({ msg: 'Add your email address first.' }); return; }
        this.setState({ msg: 'Opening your email app with your estimate addressed to you. If nothing opens, use Copy my estimate.' });
        location.href = 'mailto:' + encodeURIComponent(em) + '?subject=' + encodeURIComponent('My floral estimate from The Blonde Bouquet') + '&body=' + encodeURIComponent(text + '\n\nReady to start your proposal? Send this to La Raye at theblondebouquet@gmail.com.');
      },
      copyEst: () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => this.setState({ msg: 'Copied. Your choices are also saved on this device.' }), () => this.setState({ msg: 'Copy was blocked here. Your choices are still saved on this device.' }));
        } else { this.setState({ msg: 'Your choices are saved on this device.' }); }
      },
      arches: [
        { id: 'none', name: 'No arch', desc: 'Skip the arch for now.', price: '' },
        { id: 'archPartial', name: 'Partial coverage', desc: 'An arch with florals on part of the frame.', price: rng(P.archPartial.low, P.archPartial.high) },
        { id: 'archFull', name: 'Full arch design', desc: 'A fully covered floral arch.', price: rng(P.archFull.low, P.archFull.high) }
      ].map((o) => ({ ...o, on: s.arch === o.id, style: card(s.arch === o.id), pick: () => this.setState({ arch: o.id }) })),
      impacts: [
        { id: 'hanging', name: 'Hanging floral installation', desc: 'Florals suspended over the dance floor or head table.', price: each('hanging').replace(' each', '') },
        { id: 'circle', name: 'Aisle circle platform', desc: 'A full ring of flowers framing your vows.', price: each('circle').replace(' each', '') }
      ].map((o) => ({ ...o, on: !!s.impact[o.id], style: card(!!s.impact[o.id]), pick: () => this.setState({ impact: Object.assign({}, s.impact, { [o.id]: !s.impact[o.id] }) }) }))
    };
    ['bridal', 'maids', 'bouts', 'corsages', 'meadows', 'pillars', 'bud', 'frog', 'compote', 'tall', 'accent', 'garland'].forEach((k) => {
      const step = P[k].step || 1;
      vals['q_' + k] = s.q[k];
      vals['r_' + k] = each(k);
      vals['inc_' + k] = () => setQ(k, s.q[k] + step);
      vals['dec_' + k] = () => setQ(k, s.q[k] - step);
    });
    vals.toggleRent = () => this.setState({ rent: !s.rent });
    return vals;
  }
}

DCLite.mount(Component, {"stripe": "rose", "accent": "#A3134F"});</script>
</body>
</html>
