      accent,
      filters: cats.map((label) => {
        const on = label === cat;
        return {
          label,
          on,
          pick: () => this.setState({ cat: label }),
          style: 'font:inherit;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;padding:13px 22px;min-height:44px;border-radius:0;cursor:pointer;' + (on ? 'background:#A3134F;color:#FFFFFF;border:1px solid #A3134F;' : 'background:transparent;color:#1F1B19;border:1px solid #C9A97A;')
        };
      }),
      shown: photos.filter((p) => cat === 'All' || p.c === cat).map((p, k) => {
        const sh = { cls: 'ph', rad: '' };
        return { src: p.src, sm: p.src.replace('assets/', 'assets/sm/'), sw: Math.min(1100, p.w), w: p.w, h: p.h, alt: p.alt, cls: sh.cls, rad: sh.rad };
      })
    };
