<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#A3134F';
    const reviews = [
      { quote: 'La Raye delivered my bouquet to me directly herself with tears in her eyes.', who: 'A Blonde Bouquet bride · via Yelp' },
      { quote: '[Pull a five-star review from Google that names a specific detail of the flowers.]', who: '[First names] · [Venue, month]' },
      { quote: '[Pull a five-star review from Yelp about how easy she was to work with.]', who: '[First names] · [Venue, month]' }
    ];
    const n = reviews.length;
    const i = this.state.i;
    const stripe = this.props.stripe ?? 'rose';
    return {
      stripe,
      accent,
      review: reviews[i],
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n }),
      dots: reviews.map((r, k) => ({
        style: 'display:block;width:' + (k === i ? '30px' : '8px') + ';height:2px;background:' + (k === i ? accent : '#C9A97A') + ';transition:width .4s;'
      }))
    };
  }
}

DCLite.mount(Component, {"stripe": "rose", "accent": "#A3134F"});</script>
