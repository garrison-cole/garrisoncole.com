<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment · The Blonde Bouquet</title>
<meta name="description" content="Luxury wedding florals designed in Auburn, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&amp;family=Figtree:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6F0}
.scal{-webkit-mask:radial-gradient(circle 20px at 20px 20px,#000 95%,#0000) 0 0/40px 40px round,linear-gradient(#000 0 0) center/calc(100% - 40px) calc(100% - 40px) no-repeat;mask:radial-gradient(circle 20px at 20px 20px,#000 95%,#0000) 0 0/40px 40px round,linear-gradient(#000 0 0) center/calc(100% - 40px) calc(100% - 40px) no-repeat}
.bu{position:relative;z-index:2;height:20px;margin-top:-20px;background:radial-gradient(circle 20px at 20px 20px,var(--c) 95%,#0000) 0 0/40px 20px repeat-x}
.bd{position:relative;z-index:2;height:20px;margin-bottom:-20px;background:radial-gradient(circle 20px at 20px 0,var(--c) 95%,#0000) 0 0/40px 20px repeat-x}
.f-scal{-webkit-mask:radial-gradient(circle 18px at 18px 18px,#000 95%,#0000) 0 0/36px 36px round,linear-gradient(#000 0 0) center/calc(100% - 36px) calc(100% - 36px) no-repeat;mask:radial-gradient(circle 18px at 18px 18px,#000 95%,#0000) 0 0/36px 36px round,linear-gradient(#000 0 0) center/calc(100% - 36px) calc(100% - 36px) no-repeat}
.f-tick{-webkit-mask:radial-gradient(circle 44px at 0 0,#0000 97%,#000) 0 0/51% 51% no-repeat,radial-gradient(circle 44px at 100% 0,#0000 97%,#000) 100% 0/51% 51% no-repeat,radial-gradient(circle 44px at 0 100%,#0000 97%,#000) 0 100%/51% 51% no-repeat,radial-gradient(circle 44px at 100% 100%,#0000 97%,#000) 100% 100%/51% 51% no-repeat;mask:radial-gradient(circle 44px at 0 0,#0000 97%,#000) 0 0/51% 51% no-repeat,radial-gradient(circle 44px at 100% 0,#0000 97%,#000) 100% 0/51% 51% no-repeat,radial-gradient(circle 44px at 0 100%,#0000 97%,#000) 0 100%/51% 51% no-repeat,radial-gradient(circle 44px at 100% 100%,#0000 97%,#000) 100% 100%/51% 51% no-repeat}
.fr{background-color:#F8EFE4;background-image:url(assets/stripe-rose.svg);background-repeat:repeat;background-size:120px 480px;background-position:center top}
.fr-petal{background-image:url(assets/stripe-petal.svg)}.fr-blush{background-image:url(assets/stripe-blush.svg)}.fr-raspberry{background-image:url(assets/stripe-raspberry.svg)}
.shd{filter:drop-shadow(0 18px 38px rgba(70,45,35,.14))}
.wv{position:absolute;left:0;right:0;height:26px;pointer-events:none;z-index:3;background-repeat:repeat-x;background-size:220px 26px}
.wv-t{top:-1px}.wv-b{bottom:-1px;transform:scaleY(-1)}
.wv-iv{background-image:url(assets/wave-ivory.svg)}
a{color:#A3134F}a:hover{color:#7A0E3B}
.nv{color:#1F1B19;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:12px 0}
.nv:hover{color:#A3134F}
.btn{transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.btn:hover{background-color:#1F1B19 !important;color:#FFFFFF !important;border-color:#1F1B19 !important}
.btnl:hover{background-color:#FFFFFF !important;color:#1F1B19 !important}
.tl{color:#1F1B19;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid #B8955A;padding-bottom:6px;transition:color .3s,border-color .3s}
.tl:hover{color:#A3134F;border-color:#A3134F}
.ft a{color:#EFE6DB;text-decoration:none}.ft a:hover{color:#F29BC0}
.zm{overflow:hidden}.zm img{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}.zm:hover img{transform:scale(1.045)}
.opt{transition:border-color .3s,background-color .3s,box-shadow .3s}
.opt:hover{border-color:#A3134F !important}
.stp{transition:background-color .25s,color .25s}
.stp:hover{background-color:#1F1B19 !important;color:#FFFFFF !important}
.rng{width:100%;accent-color:#A3134F;height:28px;cursor:pointer}
.rng:focus-visible,.opt:focus-visible,.stp:focus-visible{outline:2px solid #A3134F;outline-offset:3px}
@media (min-width: 1000px){.stk{position:sticky;top:24px}}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes unveil{from{opacity:0;clip-path:inset(8% 8% 8% 8%)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: no-preference){
.in1{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .2s both}
.in2{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .45s both}
.in3{animation:up 1.2s cubic-bezier(.2,.7,.2,1) .7s both}
@supports (animation-timeline: view()){
.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.rvi{animation:unveil linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
.rvl{animation:draw linear both;animation-timeline:view();animation-range:entry 10% cover 30%}
}}
</style>
<style>html{scroll-behavior:smooth}#dc-root{min-height:100vh}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: 'Figtree', system-ui, sans-serif; font-weight: 400; color: #1F1B19; background: #FAF6F0; min-height: 100vh;">

<a href="quote.html" style="display: block; background: #1F1B19; color: #EFE6DB; text-align: center; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; padding: 12px 16px; text-decoration: none; font-weight: 500;">Now reserving 2027 dates · A limited number of weddings each month</a>

<header style="background: #FAF6F0; border-bottom: 1px solid #E3D6C3;">
<div style="max-width: 1320px; margin: 0 auto; padding: 18px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 32px;">
<a href="index.html" aria-label="The Blonde Bouquet home" style="display: block; max-width: 100%;"><img src="assets/tbb2-logo-horizontal.svg" alt="The Blonde Bouquet Floral Design" style="height: 66px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; display: block;"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 36px;">
<a class="nv" href="weddings.html">Weddings</a>
<a class="nv" href="investment.html" aria-current="page" style="color: {{accent}}; border-bottom: 1px solid {{accent}};">Investment</a>
<a class="nv" href="portfolio.html">Portfolio</a>
<a class="nv" href="about.html">About</a>
<a class="btn" href="quote.html" style="border: 1px solid {{accent}}; background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 15px 26px; font-size: 11px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">Request a Quote</a>
</nav>
</div>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 110px 28px 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 72px; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 28px;">
<p class="in1" style="margin: 0; font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: #6A605A; font-weight: 500;">The Investment Guide</p>
<h1 class="in2" style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(50px, 6.6vw, 98px); line-height: 0.98; letter-spacing: 0.04em; text-transform: uppercase;">Every number, <em style="display: block; text-transform: none; letter-spacing: 0; color: {{accent}};">upfront</em></h1>
<p class="in3" style="margin: 0; font-size: 17px; line-height: 1.85; color: #4A413C; font-weight: 300; max-width: 540px;">Most florists make you fill out a form before they'll talk numbers. We'd rather you know now. Build your wedding below and watch the estimate update as you go. It's the same math we use for every proposal.</p>
</div>
<div class="in3"><div style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 12px;">
<div class="zm" style="border-radius: 400px 400px 0 0;"><img src="assets/ig_aisle.jpg" alt="Vineyard ceremony aisle lined with ivory roses" style="width: 100%; height: 480px; object-fit: cover; display: block;"></div>
</div></div>
</section>

<section id="estimator" aria-label="Floral estimator" class="fr fr-{{stripe}}" style="padding: 72px 28px;">
<div class="shd" style="max-width: 1320px; margin: 0 auto;">
<div style="background: #FFFFFF; padding: clamp(40px, 5vw, 72px); outline: 1px solid #E2CFB0; outline-offset: -18px;">
<div style="display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; margin-bottom: 56px;">
<p style="margin: 0; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: #6A605A; font-weight: 500;">The Estimator</p>
<h2 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(34px, 4vw, 54px); line-height: 1.05;">Design your wedding, <em style="color: {{accent}};">see your number.</em></h2>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 52px;">

<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;">
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 26px;"><span style="font-style: italic; color: {{accent}}; margin-right: 10px;">i.</span>Your guest count</h3>
<p style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 40px; line-height: 1;">{{guests}} <span style="font-family: 'Figtree', sans-serif; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #6A605A;">guests</span></p>
</div>
<input class="rng" type="range" min="20" max="300" step="10" value="{{guests}}" onChange="{{setGuests}}" aria-label="Guest count">
<p style="margin: 0; font-size: 14px; color: #6A605A;">About {{tables}} guest tables of eight, plus a head or sweetheart table.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 18px;">
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 26px;"><span style="font-style: italic; color: {{accent}}; margin-right: 10px;">ii.</span>Personal flowers</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6A605A;">Your bridal bouquet is included. Add your wedding party.</p>
<div style="display: flex; flex-direction: column;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid #E3D6C3;">
<span style="font-size: 16px;">Bridesmaid bouquets</span>
<div style="display: flex; align-items: center; gap: 4px;">
<button type="button" class="stp" onClick="{{decMaids}}" aria-label="Fewer bridesmaid bouquets" style="width: 44px; height: 44px; border: 1px solid #C9A97A; background: transparent; color: #1F1B19; font: inherit; font-size: 20px; cursor: pointer;">−</button>
<span style="min-width: 48px; text-align: center; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 24px;">{{maids}}</span>
<button type="button" class="stp" onClick="{{incMaids}}" aria-label="More bridesmaid bouquets" style="width: 44px; height: 44px; border: 1px solid #C9A97A; background: transparent; color: #1F1B19; font: inherit; font-size: 20px; cursor: pointer;">+</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid #E3D6C3; border-bottom: 1px solid #E3D6C3;">
<span style="font-size: 16px;">Boutonnieres and corsages</span>
<div style="display: flex; align-items: center; gap: 4px;">
<button type="button" class="stp" onClick="{{decBouts}}" aria-label="Fewer boutonnieres and corsages" style="width: 44px; height: 44px; border: 1px solid #C9A97A; background: transparent; color: #1F1B19; font: inherit; font-size: 20px; cursor: pointer;">−</button>
<span style="min-width: 48px; text-align: center; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 24px;">{{bouts}}</span>
<button type="button" class="stp" onClick="{{incBouts}}" aria-label="More boutonnieres and corsages" style="width: 44px; height: 44px; border: 1px solid #C9A97A; background: transparent; color: #1F1B19; font: inherit; font-size: 20px; cursor: pointer;">+</button>
</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 18px;">
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 26px;"><span style="font-style: italic; color: {{accent}}; margin-right: 10px;">iii.</span>Ceremony design</h3>
<div role="group" aria-label="Ceremony design" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px;">
<sc-for list="{{ceremonies}}" as="o" hint-placeholder-count="4">
<button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.style}}">
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 20px; line-height: 1.2;">{{o.name}}</span>
<span style="font-size: 13px; line-height: 1.55; color: #5E534D;">{{o.desc}}</span>
<span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: {{accent}}; font-weight: 600;">{{o.price}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 18px;">
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 26px;"><span style="font-style: italic; color: {{accent}}; margin-right: 10px;">iv.</span>Reception centerpieces</h3>
<div role="group" aria-label="Centerpiece style" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px;">
<sc-for list="{{centers}}" as="o" hint-placeholder-count="3">
<button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.style}}">
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 20px; line-height: 1.2;">{{o.name}}</span>
<span style="font-size: 13px; line-height: 1.55; color: #5E534D;">{{o.desc}}</span>
<span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: {{accent}}; font-weight: 600;">{{o.price}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 18px;">
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 26px;"><span style="font-style: italic; color: {{accent}}; margin-right: 10px;">v.</span>Finishing touches</h3>
<div role="group" aria-label="Finishing touches" style="display: flex; flex-wrap: wrap; gap: 10px;">
<sc-for list="{{extras}}" as="x" hint-placeholder-count="5">
<button type="button" class="opt" onClick="{{x.toggle}}" aria-pressed="{{x.on}}" style="{{x.style}}">{{x.mark}} {{x.name}} <span style="color: #6A605A; font-size: 12px;">{{x.price}}</span></button>
</sc-for>
</div>
</div>
</div>

<aside class="stk" aria-live="polite" style="flex: 1 1 340px; background: #1F1B19; color: #EFE6DB; padding: 48px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; outline: 1px solid rgba(201, 169, 122, 0.6); outline-offset: -12px;">
<p style="margin: 0; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #C9A97A;">Your estimated investment</p>
<p style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: clamp(34px, 3.4vw, 44px); line-height: 1.08;">{{low}} <span style="font-style: italic; font-size: 0.6em; color: #C9A97A;">to</span> {{high}}</p>
<div style="display: flex; flex-direction: column; font-size: 14px;">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(201, 169, 122, 0.3);"><span style="color: #D8CCBF;">{{l.label}}</span><span>{{l.amount}}</span></div>
</sc-for>
</div>
<sc-if value="{{under}}" hint-placeholder-val="{{ false }}">
<div style="background: #F4E6E1; color: #1F1B19; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<p style="margin: 0; font-size: 14px; line-height: 1.65;">Our full-service weddings begin at <strong style="font-weight: 600;">{{minimum}}</strong> in florals. For a smaller celebration, our a la carte collection is a lovely fit.</p>
<a class="tl" href="a-la-carte.html" style="align-self: flex-start;">Explore a la carte</a>
</div>
</sc-if>
<sc-if value="{{over}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D8CCBF;">This is right where our couples love to design. Send it with your inquiry and La Raye will build your proposal from here.</p>
<a class="btn btnl" href="quote.html" style="text-align: center; border: 1px solid #EFE6DB; background: #EFE6DB; color: #1F1B19; text-decoration: none; padding: 17px 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;">Request a Quote</a>
</div>
</sc-if>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #A89C90;">Includes design, delivery, setup and breakdown. Final pricing depends on season, flower selection and venue. Tax not included.</p>
</aside>
</div>
</div>
</div>
</section>
<div class="rv" aria-hidden="true" style="display: flex; align-items: center; gap: 22px; max-width: 520px; margin: 0 auto; padding: 0 28px;">
<span class="rvl" style="flex: 1; height: 1px; background: #B8955A; transform-origin: right;"></span>
<img src="assets/tbb2-mark.svg" alt="" style="width: 64px; height: 64px; display: block;">
<span class="rvl" style="flex: 1; height: 1px; background: #B8955A; transform-origin: left;"></span>
</div>

<section style="max-width: 1240px; margin: 0 auto; padding: 110px 28px 130px; display: flex; flex-direction: column; gap: 56px;">
<div class="rv" style="display: flex; flex-direction: column; gap: 16px; text-align: center; align-items: center;">
<p style="margin: 0; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: #6A605A; font-weight: 500;">Where couples land</p>
<h2 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.04; letter-spacing: 0.04em; text-transform: uppercase;">Four <em style="text-transform: none; letter-spacing: 0; color: {{accent}};">collections</em></h2>
</div>
<div style="display: flex; flex-direction: column;">
<article class="rv" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 28px 56px; padding: 44px 0; border-top: 1px solid #C9A97A; align-items: center;">
<div style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 8px;"><div class="zm" style="border-radius: 400px 400px 0 0;"><img src="assets/g25.jpg" alt="Pink and coral bouquet" style="width: 100%; height: 300px; object-fit: cover; display: block;"></div></div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};">i.</span>
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1;">A La Carte</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #4A413C; font-weight: 300;">A signature bouquet and personal flowers for courthouse weddings, elopements and small ceremonies.</p>
</div>
<p style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 34px; line-height: 1.1;">$500 <em style="font-size: 0.6em; color: #6A605A;">to</em> $2,500</p>
</article>
<article class="rv" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 28px 56px; padding: 44px 0; border-top: 1px solid #C9A97A; align-items: center;">
<div style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 8px;"><div class="zm" style="border-radius: 400px 400px 0 0;"><img src="assets/ig_greenhouse.jpg" alt="Couple at a greenhouse with an ivory bouquet" style="width: 100%; height: 300px; object-fit: cover; display: block;"></div></div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};">ii.</span>
<h3 style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1;">The Intimate Collection</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #4A413C; font-weight: 300;">Personal flowers, a ceremony focal piece and garden centerpieces for smaller guest lists. Delivery and setup included.</p>
</div>
<p style="margin: 0; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 34px; line-height: 1.1;">$8,000 <em style="font-size: 0.6em; color: #6A605A;">to</em> $12,000</p>
</article>
<article class="rv" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 28px 56px; padding: 44px 0; border-top: 1px solid #C9A97A; align-items: center;">
<div style="border: 1px solid #B8955A; border-radius: 400px 400px 0 0; padding: 8px;"><div class="zm" style="border-radius: 400px 400px 0 0;"><img src="assets/ig_oak.jpg" alt="Ivory rose arch under an oak tree" style="width: 100%; height: 300px; object-fit: cover; display: block;"></div></div>

<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { guests: 120, maids: 6, bouts: 8, ceremony: 'arch', center: 'low', extras: { garland: true, bar: true, cake: false, hanging: false, welcome: false } };
  }
  renderVals() {
    const p = this.props;
    const accent = p.accent ?? '#A3134F';
    const n = (v, d) => (typeof v === 'number' && !isNaN(v) ? v : d);
    const P = {
      min: n(p.minimum, 8000), fee: n(p.feePct, 22) / 100,
      bridal: n(p.pBridal, 450), maid: n(p.pMaid, 165), bout: n(p.pBout, 45),
      focal: n(p.pFocal, 1400), arch: n(p.pArch, 4200), meadow: n(p.pMeadow, 7500), grand: n(p.pGrand, 14000),
      bud: n(p.pBud, 120), low: n(p.pLow, 295), tall: n(p.pTall, 750),
      garland: n(p.pGarland, 1600), bar: n(p.pBar, 900), cake: n(p.pCake, 250), hanging: n(p.pHanging, 8500), welcome: n(p.pWelcome, 1200)
    };
    const s = this.state;
    const money = (v) => '$' + Math.round(v).toLocaleString('en-US');
    const round100 = (v) => Math.round(v / 100) * 100;
    const tables = Math.ceil(s.guests / 8);

    const cerOpts = [
      { id: 'focal', name: 'Focal arrangements', desc: 'A pair of lush pieces framing your vows.', cost: P.focal },
      { id: 'arch', name: 'Arch or chuppah', desc: 'A fully designed floral arch or chuppah.', cost: P.arch },
      { id: 'meadow', name: 'Meadow and aisle', desc: 'Ground installations that line the aisle and altar.', cost: P.meadow },
      { id: 'grand', name: 'Grand installation', desc: 'A statement ceremony built to stop people in their tracks.', cost: P.grand }
    ];
    const cenOpts = [
      { id: 'bud', name: 'Bud vase collections', desc: 'Clusters of single stems in glass.', cost: P.bud },
      { id: 'low', name: 'Lush low garden', desc: 'Our signature gathered, textural centerpiece.', cost: P.low },
      { id: 'tall', name: 'Tall statement', desc: 'Elevated arrangements with candlelight.', cost: P.tall }
    ];
    const exOpts = [
      { id: 'garland', name: 'Head or sweetheart table garland', cost: P.garland },
      { id: 'bar', name: 'Cocktail hour and bar florals', cost: P.bar },
      { id: 'cake', name: 'Cake flowers', cost: P.cake },
      { id: 'welcome', name: 'Welcome and escort display', cost: P.welcome },
      { id: 'hanging', name: 'Hanging installation', cost: P.hanging }
    ];

    const card = (on) => 'text-align:left;display:flex;flex-direction:column;gap:10px;padding:22px 20px;cursor:pointer;font:inherit;color:#1F1B19;min-height:44px;border-radius:0;background:' + (on ? '#FAF6F0' : 'transparent') + ';border:1px solid ' + (on ? accent : '#D9C9AE') + ';box-shadow:' + (on ? 'inset 0 0 0 1px ' + accent : 'none') + ';';
    const chip = (on) => 'font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;min-height:44px;cursor:pointer;border-radius:0;color:#1F1B19;background:' + (on ? '#FAF6F0' : 'transparent') + ';border:1px solid ' + (on ? accent : '#D9C9AE') + ';box-shadow:' + (on ? 'inset 0 0 0 1px ' + accent : 'none') + ';';

    const personal = P.bridal + s.maids * P.maid + s.bouts * P.bout;
    const ceremonyCost = (cerOpts.find((o) => o.id === s.ceremony) || cerOpts[1]).cost;
    const centerCost = (cenOpts.find((o) => o.id === s.center) || cenOpts[1]).cost * tables;
    const extrasCost = exOpts.reduce((t, o) => t + (s.extras[o.id] ? o.cost : 0), 0);
    const sub = personal + ceremonyCost + centerCost + extrasCost;
    const fee = sub * P.fee;
    const total = sub + fee;
    const low = round100(total * 0.92);
    const high = round100(total * 1.12);
    const under = total < P.min;

    const setX = (k, v) => this.setState({ [k]: v });
    const stripe = p.stripe ?? 'rose';
    return {
      stripe,
      accent,
      guests: s.guests,
      tables,
      maids: s.maids,
      bouts: s.bouts,
      setGuests: (e) => setX('guests', Number(e.target.value)),
      incMaids: () => setX('maids', Math.min(16, s.maids + 1)),
      decMaids: () => setX('maids', Math.max(0, s.maids - 1)),
      incBouts: () => setX('bouts', Math.min(30, s.bouts + 1)),
      decBouts: () => setX('bouts', Math.max(0, s.bouts - 1)),
      ceremonies: cerOpts.map((o) => ({ ...o, on: s.ceremony === o.id, style: card(s.ceremony === o.id), price: money(o.cost), pick: () => setX('ceremony', o.id) })),
      centers: cenOpts.map((o) => ({ ...o, on: s.center === o.id, style: card(s.center === o.id), price: money(o.cost) + ' per table', pick: () => setX('center', o.id) })),
      extras: exOpts.map((o) => ({ ...o, on: !!s.extras[o.id], mark: s.extras[o.id] ? '✓' : '+', style: chip(!!s.extras[o.id]), price: money(o.cost), toggle: () => this.setState({ extras: { ...s.extras, [o.id]: !s.extras[o.id] } }) })),
      low: money(low),
      high: money(high),
      lines: [
        { label: 'Personal flowers', amount: money(personal) },
        { label: 'Ceremony', amount: money(ceremonyCost) },
        { label: 'Reception, ' + tables + ' tables', amount: money(centerCost) },
        { label: 'Finishing touches', amount: money(extrasCost) },
        { label: 'Design, delivery and setup', amount: money(fee) }
      ],
      under,
      over: !under,
      minimum: money(P.min)
    };
  }
}

DCLite.mount(Component, {"stripe": "rose", "accent": "#A3134F", "minimum": 8000, "feePct": 22, "pBridal": 450, "pMaid": 165, "pBout": 45, "pFocal": 1400, "pArch": 4200, "pMeadow": 7500, "pGrand": 14000, "pBud": 120, "pLow": 295, "pTall": 750, "pGarland": 1600, "pBar": 900, "pCake": 250, "pHanging": 8500, "pWelcome": 1200});</script>
