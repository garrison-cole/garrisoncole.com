<!doctype html>
<html lang="en" data-page="websites">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A website that brings you customers | Garrison Cole, Roseville</title>
<meta name="description" content="Website design for owner-run businesses in Roseville, Rocklin, Folsom and the Sacramento area. I build your site first. You pay only if you want it live.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://garrisoncole.com/websites">
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#FAFAF9;color:#111418;font-family:'Inter','Helvetica Neue',Arial,sans-serif}
a{color:#111418;text-decoration-color:#9AA0A8}a:hover{color:#4A4F58}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}
button:disabled{opacity:.6;cursor:default}
img{max-width:100%}
:focus-visible{outline:3px solid #111418;outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.vh:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip-path:none;background:#fff;padding:10px 14px;z-index:9}
#dc-root{min-height:100vh}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
<script src="lp.js" defer></script>
</head>
<body>
<a class="vh" href="#start">Skip to the page</a>
<div id="dc-root"></div>
<noscript><p style="padding:24px;font-size:18px">Garrison Cole, Roseville, CA. Call or text <a href="tel:+17606444559">760-644-4559</a>.</p></noscript>
<template id="dc-tpl">
<div style="background: #FAFAF9; color: #111418; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased">

<!-- Top bar -->
<header style="border-bottom: 1px solid #E6E6E3">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 40px); min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">Garrison Cole</span>
<a href="tel:+17606444559" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1.5px solid #111418; border-radius: 999px; color: #111418; text-decoration: none; font-weight: 600; font-size: 15px">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
<span>760-644-4559</span>
</a>
</div>
</header>

<!-- Hero -->
<section id="start" style="max-width: 1160px; margin: 0 auto; padding: clamp(36px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 72px); align-items: center">

<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{hasKw}}"><div style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 999px; font-size: 14px; color: #5E636D">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E636D" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span>{{keyword}}</span>
</div></sc-if>
<h1 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(46px, 26px + 5vw, 84px); font-weight: 600; line-height: 0.98; letter-spacing: -0.035em; text-wrap: balance">{{h1}}</h1>
<p style="margin: 0; font-size: clamp(19px, 17px + 0.4vw, 22px); line-height: 1.4; color: #4A4F58">{{lede}}</p>

<div style="max-width: 480px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{step1}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{nextHero}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<label for="co1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Company name</label>
<input id="co1" type="text" autocomplete="organization" placeholder="Your company name" value="{{company}}" onChange="{{setCompany}}" style="flex: 1 1 220px; min-width: 0; min-height: 56px; padding: 0 16px; font-size: 17px; border: 1.5px solid #111418; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" style="flex: 0 0 auto; min-height: 56px; padding: 0 22px; border: 0; border-radius: 10px; background: #111418; color: #FFFFFF; font-size: 17px; font-weight: 600">{{cta}}</button>
</form>
</sc-if>
<sc-if value="{{step2}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{sendHero}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-label="Leave this empty" value="{{trap}}" onChange="{{setTrap}}" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0">
<label for="ph1" style="flex: 1 0 100%; font-weight: 600">{{askPhone}}</label>
<input id="ph1" type="tel" inputmode="tel" autocomplete="tel" placeholder="Cell number" value="{{phone}}" onChange="{{setPhone}}" style="flex: 1 1 220px; min-width: 0; min-height: 56px; padding: 0 16px; font-size: 17px; border: 1.5px solid #111418; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" style="flex: 0 0 auto; min-height: 56px; padding: 0 22px; border: 0; border-radius: 10px; background: #111418; color: #FFFFFF; font-size: 17px; font-weight: 600">{{sendLabel}}</button>
</form>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="font-size: 15px; color: #A33A2B; font-weight: 600">{{errMsg}}</div></sc-if>
<sc-if value="{{sendFail}}"><div role="alert" style="font-size: 15px; color: #A33A2B; font-weight: 600">That didn't go through. <a href="{{smsHref}}" style="color: inherit">Text me at 760-644-4559</a> and I'll take it from there.</div></sc-if>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 16px 18px; background: {{accentSoft}}; border: 1px solid {{accent}}; border-radius: 12px">
<div style="font-weight: 600">Got it, {{company}}.</div>
<div style="font-size: 15px; color: #4A4F58">{{doneLine}}</div>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: #5E636D">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="2">
<span style="display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>{{t.label}}</span>
</sc-for>
</div>
</div>
<sc-if value="{{hasBooking}}"><a href="{{bookingUrl}}" target="_blank" rel="noopener" onClick="{{bookClick}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600">Or pick a time to talk</a></sc-if>
<div style="display: flex; align-items: center; gap: 12px; padding-top: 4px">
<img src="garrison.webp" width="56" height="56" alt="Garrison Cole" style="flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover">
<div style="font-size: 15px; line-height: 1.35"><strong style="font-weight: 600">Garrison Cole, Roseville.</strong><br><span style="color: #5E636D">Local, and glad to meet in person.</span></div>
</div>
</div>

<!-- Phone: the result -->
<div style="flex: 0 1 340px; min-width: 0; margin: 0 auto">
<sc-if value="{{web}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 2px solid #111418; border-radius: 36px; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 60px -30px rgba(17,20,24,.45)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="min-width: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere">{{coName}}</span>
<span style="flex: none; padding: 8px 14px; background: {{accent}}; color: #FFFFFF; border-radius: 999px; font-size: 13px; font-weight: 700">Call now</span>
</div>
<div style="height: 150px; background: #ECECE8; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5E636D">your best work</div>
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.05; letter-spacing: -0.025em">{{siteHead}}</div>
<div style="font-size: 14px; color: #5E636D"><span aria-hidden="true" style="color: {{accent}}; letter-spacing: 2px">★★★★★</span> Your Google reviews</div>
<div style="display: flex; gap: 8px">
<span style="flex: 1; padding: 12px 6px; background: #111418; color: #FFFFFF; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center">Tap to call</span>
<span style="flex: 1; padding: 12px 6px; border: 1.5px solid #111418; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center">Get a quote</span>
</div>
</div>
<div style="margin-top: 14px; text-align: center; font-size: 14px; color: #5E636D">Type your company name. That's your site.</div>
</sc-if>
<sc-if value="{{grow}}" hint-placeholder-val="{{ false }}">
<div style="background: #111418; color: #FFFFFF; border-radius: 36px; padding: 26px 18px 30px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 60px -30px rgba(17,20,24,.45)">
<div style="text-align: center; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 52px; font-weight: 500; letter-spacing: -0.02em; line-height: 1">4:21</div>
<div style="text-align: center; font-size: 14px; color: #C8CCD4; margin-bottom: 8px">Tuesday</div>
<div style="padding: 12px 14px; background: #262A31; border-radius: 14px"><div style="font-size: 12px; color: #C8CCD4">Missed call · 4:15</div><div style="font-size: 15px; font-weight: 500">New customer, {{town}}</div></div>
<div style="padding: 12px 14px; background: #262A31; border-radius: 14px"><div style="font-size: 12px; color: #C8CCD4">Auto-text sent · 4:16</div><div style="font-size: 15px; font-weight: 500">Here's a link to book your estimate.</div></div>
<div style="padding: 12px 14px; background: #FFFFFF; color: #111418; border-radius: 14px"><div style="font-size: 12px; font-weight: 600; color: {{accentInk}}">New job booked · 4:21</div><div style="font-size: 15px; font-weight: 600">{{bookedLine}}</div></div>
</div>
<div style="margin-top: 14px; text-align: center; font-size: 14px; color: #5E636D">You were with another customer the whole time.</div>
</sc-if>
</div>
</section>

<!-- Live demo -->
<section style="background: #FFFFFF; border-top: 1px solid #E6E6E3; border-bottom: 1px solid #E6E6E3">
<div style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(30px, 22px + 2vw, 46px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em">Tap your business. Watch it work.</h2>

<div style="display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Kind of work" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{trades}}" as="t" hint-placeholder-count="8">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #111418; border-radius: 999px; background: #111418; color: #FFFFFF; font-size: 15px; font-weight: 600">{{t.label}}</button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #D3D3CF; border-radius: 999px; background: #FFFFFF; color: #111418; font-size: 15px; font-weight: 500">{{t.label}}</button></sc-if>
</sc-for>
<label for="fld" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Type your field</label>
<input id="fld" type="text" placeholder="Or type yours" value="{{custom}}" onChange="{{setCustom}}" style="flex: 0 1 180px; min-width: 140px; min-height: 44px; box-sizing: border-box; padding: 0 16px; font-size: 15px; border: 1.5px dashed #9AA0A8; border-radius: 999px; background: #FFFFFF; color: #111418">
</div>
<div role="group" aria-label="Where she finds you" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{channels}}" as="c" hint-placeholder-count="3">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border: 1.5px solid {{accent}}; border-radius: 10px; background: {{accentSoft}}; color: #111418; font-size: 15px; font-weight: 600">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border: 1.5px solid #D3D3CF; border-radius: 10px; background: #FFFFFF; color: #111418; font-size: 15px; font-weight: 500">{{c.label}}</button></sc-if>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">

<div style="flex: 1 1 260px; min-width: 0; background: #FAFAF9; border: 1px solid #E6E6E3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{accentInk}}">{{p1Title}}</div>
<sc-if value="{{isChat}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-end; max-width: 92%; padding: 12px 14px; background: #111418; color: #FFFFFF; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.35">{{chatQ}}</div>
</sc-if>
<sc-if value="{{notChat}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D3D3CF; border-radius: 999px; font-size: 15px">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E636D" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span style="min-width: 0; overflow-wrap: anywhere; line-height: 1.25">{{query}}</span>
</div>
</sc-if>
</div>

<div style="flex: 1 1 260px; min-width: 0; background: #FAFAF9; border: 1px solid #E6E6E3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{accentInk}}">You show up first</div>
<div style="padding: 14px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 10px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #5E636D"><span style="font-weight: 700; color: #111418">Sponsored</span> · {{coName}}</div>
<div style="font-size: 17px; font-weight: 600; line-height: 1.25; color: #1B4B9B; overflow-wrap: anywhere">{{adLine}}</div>
<sc-if value="{{isFeed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px">
<div style="flex: 1; height: 64px; background: #ECECE8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E636D">before</div>
<div style="flex: 1; height: 64px; background: {{accentSoft}}; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{accentInk}}">after</div>
</div>
</sc-if>
</div>
</div>

<div style="flex: 1 1 260px; min-width: 0; background: #FAFAF9; border: 1px solid #E6E6E3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{accentInk}}">Your page closes it</div>
<div style="align-self: center; width: 100%; max-width: 220px; background: #FFFFFF; border: 2px solid #111418; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere">{{coName}}</span>
<span style="flex: none; padding: 5px 10px; background: {{accent}}; color: #FFFFFF; border-radius: 999px; font-size: 11px; font-weight: 700">Call</span>
</div>
<div style="height: 64px; background: #ECECE8; border-radius: 8px"></div>
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em">{{pageHead}}</div>
<span style="padding: 8px; background: #111418; color: #FFFFFF; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center">{{pageBtn}}</span>
</div>
</div>
</div>

<div style="font-size: 15px; color: #5E636D">Website, ads, follow-up, pricing and sales calls. I tell you which one to fix first, before you spend a dollar.</div>
</div>
</section>

<!-- Proof -->
<section style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(30px, 22px + 2vw, 46px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em">The numbers.</h2>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 240px; min-width: 0; padding: 24px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 14px; display: flex; flex-direction: column; justify-content: center">
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em">$4.08</div>
<div style="margin-top: 8px; font-size: 16px; color: #4A4F58">back per $1. One spring, $12,149 in ads returned $49,616.</div>
</div>
<div style="flex: 1 1 240px; min-width: 0; padding: 24px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 14px; display: flex; flex-direction: column; justify-content: center">
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em">0 → 12</div>
<div style="margin-top: 8px; font-size: 16px; color: #4A4F58">applications a day, after I fixed a page that quit loading</div>
</div>
<div style="flex: 2 1 380px; min-width: 0; padding: 14px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 14px">
<img src="work-florist.jpg" width="1280" height="800" loading="lazy" alt="Home page of a wedding florist website Garrison built" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid #E6E6E3">
<div style="margin: 12px 10px 6px; font-size: 16px; color: #4A4F58"><strong style="font-weight: 600; color: #111418">A site I built.</strong> Wedding florist, Auburn.</div>
</div>
</div>
<div style="font-size: 14px; color: #5E636D">Numbers are from one client, an online coaching company. Names stay private, and I'll walk you through them on a call.</div>
</section>

<!-- Steps + about -->
<section style="background: #FFFFFF; border-top: 1px solid #E6E6E3; border-bottom: 1px solid #E6E6E3">
<div style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 72px)">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(30px, 22px + 2vw, 46px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em">{{stepsH}}</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li style="display: flex; gap: 14px; align-items: baseline">
<span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{s.n}}</span>
<span style="font-size: 18px"><strong style="font-weight: 600">{{s.title}}</strong> <span style="color: #5E636D">{{s.body}}</span></span>
</li>
</sc-for>
</ol>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; gap: 18px; align-items: center">
<img src="garrison.webp" width="120" height="120" loading="lazy" alt="Garrison Cole" style="flex: none; width: 120px; height: 120px; border-radius: 14px; object-fit: cover">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Garrison Cole</div>
<div style="font-size: 16px; color: #4A4F58">I live in Roseville with my wife and son. You work with me, start to finish.</div>
</div>
</div>
</div>
</section>

<!-- FAQ -->
<section style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: 14px 40px">
<sc-for list="{{faq}}" as="f" hint-placeholder-count="4">
<div style="flex: 1 1 400px; min-width: 0; padding-top: 14px; border-top: 1px solid #D3D3CF">
<div style="font-weight: 600">{{f.q}}</div>
<div style="font-size: 16px; color: #5E636D">{{f.a}}</div>
</div>
</sc-for>
</section>

<!-- Close -->
<section style="background: #111418; color: #FFFFFF">
<div style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(32px, 24px + 2.4vw, 54px); font-weight: 600; line-height: 1.02; letter-spacing: -0.03em">{{closeH}}</h2>
<div style="flex: 1 1 340px; max-width: 480px; min-width: 0">
<sc-if value="{{step1}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{nextClose}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<label for="co2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Company name</label>
<input id="co2" type="text" autocomplete="organization" placeholder="Your company name" value="{{company}}" onChange="{{setCompany}}" style="flex: 1 1 200px; min-width: 0; min-height: 56px; padding: 0 16px; font-size: 17px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" style="flex: 0 0 auto; min-height: 56px; padding: 0 22px; border: 1.5px solid #FFFFFF; border-radius: 10px; background: #111418; color: #FFFFFF; font-size: 17px; font-weight: 600">{{cta}}</button>
</form>
</sc-if>
<sc-if value="{{step2}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{sendClose}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-label="Leave this one empty" value="{{trap}}" onChange="{{setTrap}}" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0">
<label for="ph2" style="flex: 1 0 100%; font-weight: 600">{{askPhone}}</label>
<input id="ph2" type="tel" inputmode="tel" autocomplete="tel" placeholder="Cell number" value="{{phone}}" onChange="{{setPhone}}" style="flex: 1 1 200px; min-width: 0; min-height: 56px; padding: 0 16px; font-size: 17px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" style="flex: 0 0 auto; min-height: 56px; padding: 0 22px; border: 1.5px solid #FFFFFF; border-radius: 10px; background: #111418; color: #FFFFFF; font-size: 17px; font-weight: 600">{{sendLabel}}</button>
</form>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top: 8px; font-size: 15px; color: #FFB4A8; font-weight: 600">{{errMsg}}</div></sc-if>
<sc-if value="{{sendFail}}"><div role="alert" style="margin-top: 8px; font-size: 15px; color: #FFB4A8; font-weight: 600">That didn't go through. <a href="{{smsHref}}" style="color: inherit">Text me at 760-644-4559</a> and I'll take it from there.</div></sc-if>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status"><div style="font-size: 20px; font-weight: 600">Got it, {{company}}.</div><div style="font-size: 15px; color: #C8CCD4">{{doneLine}}</div></div>
</sc-if>
</div>
</div>
<div style="max-width: 1160px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 40px) 28px; font-size: 14px; color: #C8CCD4">Garrison Cole · Roseville, CA · <a href="tel:+17606444559" style="color: #FFFFFF">760-644-4559</a> · <a href="mailto:garrison@garrisoncole.com" style="color: #FFFFFF">garrison@garrisoncole.com</a> · <a href="privacy.html" style="color: #FFFFFF">Privacy</a></div>
</section>

</div>
</template>
</body>
</html>
