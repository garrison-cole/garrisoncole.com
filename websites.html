<!doctype html>
<html lang="en" data-page="websites">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Design in Roseville, CA | Garrison Cole</title>
<meta name="description" content="Website design for owner-run businesses in Roseville, Rocklin, Folsom and the Sacramento area. I build your site first. You pay only if you want it live.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://garrisoncole.com/websites">
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://app.cal.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#FAFAF9}
a{color:#111418;text-decoration-color:#9AA0A8}a:hover{color:#4A4F58}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid #2348E0;outline-offset:3px}
.dark :focus-visible{outline-color:#FFD84A}
.dark .light :focus-visible{outline-color:#2348E0}
.hl{background:linear-gradient(transparent 62%,#FFD84A 62%,#FFD84A 93%,transparent 93%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .05em}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(-10px) scale(.95)}70%{opacity:1;transform:translateY(2px) scale(1.02)}100%{opacity:1;transform:none}}
.in1{animation:rise .35s .05s both}.in2{animation:rise .35s .45s both}.in3{animation:pop .45s .9s both}
.tapme{transition:transform .12s ease,box-shadow .12s ease}
.tapme:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(17,20,24,.55)}
.tapme:active{transform:scale(.98)}
.rng{display:block;width:100%;height:28px;margin:6px 0 2px;accent-color:#2348E0;cursor:pointer}
.stick{position:sticky;bottom:0;z-index:5}
@media (min-width:768px){.stick{display:none !important}}
@media (prefers-reduced-motion: reduce){.in1,.in2,.in3{animation:none}.tapme{transition:none}}
button:disabled{opacity:.6;cursor:default}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.vh:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip-path:none;background:#fff;padding:10px 14px;z-index:9}
#dc-root{min-height:100vh}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
<script src="lp.js?v=20261110g" defer></script>
</head>
<body>
<a class="vh" href="#start">Skip to the page</a>
<div id="dc-root"></div>
<noscript><p style="padding:24px;font-size:18px">Garrison Cole, Roseville, CA. Text <a href="sms:+17606444559">760-644-4559</a> or <a href="https://cal.com/garrison-cole/call">pick a time for a free call</a>.</p></noscript>
<template id="dc-tpl">
<div style="background: #FAFAF9; color: #111418; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased">

<!-- Top bar -->
<header style="border-bottom: 1px solid #E6E6E3">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 40px); min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">Garrison Cole</span>
<a href="#book" class="tapme" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #2348E0; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Book a call</a>
</div>
</header>

<!-- Hero -->
<section id="start" style="max-width: 1160px; margin: 0 auto; padding: clamp(30px, 6vw, 84px) clamp(18px, 4vw, 40px) clamp(40px, 6vw, 80px); display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 72px); align-items: center">

<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(46px, 26px + 5vw, 84px); font-weight: 600; line-height: 0.98; letter-spacing: -0.035em; text-wrap: balance"><span style="display: block; margin-bottom: 14px; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: 0; color: #4A4F58">{{topic}}</span>{{h1a}}<span class="hl">{{h1b}}</span></h1>
<p style="margin: 0; max-width: 560px; font-size: clamp(19px, 17px + 0.4vw, 22px); line-height: 1.4; color: #4A4F58">{{lede}}</p>

<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="#book" class="tapme" style="display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 26px; border-radius: 10px; background: #2348E0; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 600">Book a free call</a>
<a href="#video" class="tapme" style="display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 22px; border: 1.5px solid #111418; border-radius: 10px; background: #FFFFFF; color: #111418; text-decoration: none; font-size: 18px; font-weight: 600">{{altBtn}}</a>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding-top: 4px">
<img src="garrison.webp" width="56" height="56" alt="Garrison Cole, Roseville, CA" style="flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover">
<div style="font-size: 15px; line-height: 1.35"><strong style="font-weight: 600">Garrison Cole, Roseville.</strong><br><span style="color: #5E636D">Local, and glad to meet in person.</span></div>
</div>
</div>

<!-- One simple before and after -->
<div style="flex: 0 1 340px; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{grow}}" hint-placeholder-val="{{ true }}">
<div id="{{mockId}}" class="dark" style="background: #111418; color: #FFFFFF; border-radius: 36px; padding: 26px 18px 28px; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 60px -30px rgba(17,20,24,.45)">
<div style="text-align: center; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 50px; font-weight: 500; letter-spacing: -0.02em; line-height: 1">{{clock}}</div>
<div style="text-align: center; font-size: 14px; color: #C8CCD4; margin-bottom: 6px">Tuesday</div>
<div class="in1" style="padding: 12px 14px; background: #262A31; border-radius: 14px"><div style="font-size: 12px; color: #C8CCD4">Missed call · 4:15</div><div style="font-size: 15px; font-weight: 500">New customer, {{town}}</div></div>
<sc-if value="{{today}}" hint-placeholder-val="{{ true }}">
<div class="in2" style="padding: 12px 14px; background: #262A31; border-radius: 14px"><div style="font-size: 12px; color: #C8CCD4">Text · 5:02</div><div style="font-size: 15px; font-weight: 500">“Never mind, we found someone.”</div></div>
</sc-if>
<sc-if value="{{engine}}" hint-placeholder-val="{{ false }}">
<div class="in2" style="padding: 12px 14px; background: #262A31; border-radius: 14px"><div style="font-size: 12px; color: #C8CCD4">Auto-text sent · 4:16</div><div style="font-size: 15px; font-weight: 500">Sorry I missed you. Here’s a link to book.</div></div>
<div class="in3" style="padding: 12px 14px; background: #FFD84A; color: #111418; border-radius: 14px"><div style="font-size: 12px; font-weight: 700">New job booked · 4:21</div><div style="font-size: 15px; font-weight: 600">Estimate, Thursday 8am</div></div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{web}}" hint-placeholder-val="{{ false }}">
<div id="{{mockId}}" style="background: #FFFFFF; border: 2px solid #111418; border-radius: 36px; padding: 18px 16px 22px; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 60px -30px rgba(17,20,24,.45)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="min-width: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere">{{coName}}</span>
<sc-if value="{{engine}}" hint-placeholder-val="{{ false }}"><span class="in1" style="flex: none; padding: 8px 14px; background: #2348E0; color: #FFFFFF; border-radius: 999px; font-size: 13px; font-weight: 700">Call now</span></sc-if>
</div>
<sc-if value="{{today}}" hint-placeholder-val="{{ true }}">
<div class="in1" style="height: 120px; background: #ECECE8; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5E636D">one stock photo</div>
<div class="in1" style="padding: 4px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 19px; text-align: center; color: #5E636D">Welcome to our website!</div>
<div class="in2" style="font-size: 13px; text-align: center; text-decoration: underline; color: #5E636D">contact us</div>
</sc-if>
<sc-if value="{{engine}}" hint-placeholder-val="{{ false }}">
<div class="in1" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div style="height: 96px; background: #DCDCD7; border-radius: 10px"></div>
<div style="height: 96px; background: #ECECE8; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; color: #4A4F58">your best work</div>
<div style="height: 96px; background: #DCDCD7; border-radius: 10px"></div>
</div>
<div class="in1" style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 27px; font-weight: 600; line-height: 1.05; letter-spacing: -0.025em">Good work, done right in {{town}}.</div>
<div class="in2" style="font-size: 14px; color: #4A4F58"><span aria-hidden="true" style="color: #F2A900; letter-spacing: 2px">★★★★★</span> Your Google reviews</div>
<div class="in2" style="display: flex; gap: 8px">
<span style="flex: 1; padding: 12px 6px; background: #111418; color: #FFFFFF; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center">Tap to call</span>
<span style="flex: 1; padding: 12px 6px; border: 1.5px solid #111418; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center">Get a quote</span>
</div>
<div class="in3" style="padding: 12px 14px; background: #FFD84A; color: #111418; border-radius: 14px"><div style="font-size: 12px; font-weight: 700">Quote request · just now</div><div style="font-size: 15px; font-weight: 600; line-height: 1.3">“Saw your reviews. Can you come out Thursday?”</div></div>
</sc-if>
</div>
</sc-if>

<div role="group" aria-label="Before and after" style="align-self: center; display: inline-flex; padding: 4px; background: #FFFFFF; border: 1px solid #E6E6E3; border-radius: 999px">
<sc-if value="{{today}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="true" onClick="{{showToday}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #111418; color: #FFFFFF; font-size: 15px; font-weight: 600">{{tabA}}</button></sc-if>
<sc-if value="{{engine}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="false" onClick="{{showToday}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #111418; font-size: 15px; font-weight: 500">{{tabA}}</button></sc-if>
<sc-if value="{{today}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{showEngine}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #111418; font-size: 15px; font-weight: 500">{{tabB}}</button></sc-if>
<sc-if value="{{engine}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{showEngine}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #2348E0; color: #FFFFFF; font-size: 15px; font-weight: 600">{{tabB}}</button></sc-if>
</div>
<div style="text-align: center; font-size: 14px; color: #5E636D">{{mockCaption}}</div>
<sc-if value="{{web}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Your company name</label>
<input id="co3" type="text" autocomplete="organization" placeholder="Type your company name" value="{{company}}" onChange="{{setCompany}}" style="min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 16px; font-size: 16px; text-align: center; border: 1.5px solid #111418; border-radius: 10px; background: #FFFFFF; color: #111418">
</div>
</sc-if>
</div>
</section>

<!-- Book -->
<section id="book" class="dark" style="background: #111418; color: #FFFFFF">
<div style="max-width: 1160px; margin: 0 auto; padding: clamp(52px, 6vw, 88px) clamp(18px, 4vw, 40px) clamp(28px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(22px, 3vw, 32px); align-items: flex-start">
<div style="flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(34px, 24px + 2.6vw, 56px); font-weight: 600; line-height: 1.02; letter-spacing: -0.03em; max-width: 900px; text-wrap: balance">{{bookH}}</h2>
<p style="margin: 0; max-width: 480px; font-size: 18px; color: #C8CCD4">{{bookSub}}</p>
</div>
<div class="light" style="flex: 1 1 100%; max-width: 900px; min-width: 0; margin: 0; padding: 18px; background: #FFFFFF; color: #111418; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="garrison.webp" width="44" height="44" alt="" style="flex: none; width: 44px; height: 44px; border-radius: 50%; object-fit: cover">
<div style="line-height: 1.3"><div style="font-weight: 600">Call with Garrison Cole</div><div style="font-size: 14px; color: #5E636D">Free · 30 minutes · Zoom or in person</div></div>
</div>
<sc-if value="{{hasCal}}" hint-placeholder-val="{{ true }}">
<div id="cal-inline" data-keep style="min-height: 430px; overflow: auto; border-radius: 12px"></div>
<a href="{{bookingUrl}}" target="_blank" rel="noopener" onClick="{{bookClick}}" style="align-self: center; display: inline-flex; align-items: center; min-height: 32px; font-size: 14px; color: #5E636D">Calendar not showing? Open it in a new tab.</a>
</sc-if>
<sc-if value="{{noCal}}" hint-placeholder-val="{{ false }}">
<a href="{{bookingUrl}}" target="_blank" rel="noopener" onClick="{{bookClick}}" class="tapme" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 20px; border-radius: 10px; background: #2348E0; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 600">Pick a time</a>
</sc-if>
</div>
</div>

<div id="video" style="max-width: 1160px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 40px) clamp(40px, 5vw, 60px)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 32px; padding: 20px 0 0; border-top: 1px solid #3A3F48">
<div style="flex: 1 1 320px; min-width: 0">
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">{{altH}}</div>
<div style="font-size: 16px; color: #C8CCD4">{{altSub}}</div>
</div>
<div style="flex: 1 1 340px; max-width: 480px; min-width: 0">
<sc-if value="{{step1}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{nextHero}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<label for="co1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Company name</label>
<input id="co1" type="text" autocomplete="organization" placeholder="Your company name" value="{{company}}" onChange="{{setCompany}}" style="flex: 1 1 200px; min-width: 0; min-height: 56px; box-sizing: border-box; padding: 0 16px; font-size: 17px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" class="tapme" style="flex: 1 0 auto; min-height: 56px; padding: 0 22px; border: 0; border-radius: 10px; background: #FFD84A; color: #111418; font-size: 17px; font-weight: 700">{{cta}}</button>
</form>
</sc-if>
<sc-if value="{{step2}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{sendHero}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-label="Leave this empty" value="{{trap}}" onChange="{{setTrap}}" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0">
<label for="ph1" style="flex: 1 0 100%; font-weight: 600">{{askPhone}}</label>
<input id="ph1" type="tel" inputmode="tel" autocomplete="tel" placeholder="Cell number" value="{{phone}}" onChange="{{setPhone}}" style="flex: 1 1 200px; min-width: 0; min-height: 56px; box-sizing: border-box; padding: 0 16px; font-size: 17px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111418">
<button type="submit" class="tapme" style="flex: 1 0 auto; min-height: 56px; padding: 0 22px; border: 0; border-radius: 10px; background: #FFD84A; color: #111418; font-size: 17px; font-weight: 700">{{sendLabel}}</button>
</form>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top: 8px; font-size: 15px; color: #FFB4A8; font-weight: 600">{{errMsg}}</div></sc-if>
<sc-if value="{{sendFail}}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top: 8px; font-size: 15px; color: #FFB4A8; font-weight: 600">That didn’t send. <a href="{{smsHref}}" style="color: #FFFFFF">Text me instead</a>.</div></sc-if>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status"><div style="font-size: 20px; font-weight: 600">Got it, {{company}}.</div><div style="font-size: 15px; color: #C8CCD4">{{doneLine}}</div></div>
</sc-if>
</div>
</div>
</div>
</section>

<!-- What I do -->
<section style="background: #FFFFFF; border-top: 1px solid #E6E6E3; border-bottom: 1px solid #E6E6E3">
<div style="max-width: 1160px; margin: 0 auto; padding: clamp(48px, 6vw, 84px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(24px, 5vw, 72px)">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(30px, 22px + 2vw, 46px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em">{{doH}}</h2>
<p style="margin: 0; max-width: 420px; font-size: 18px; color: #4A4F58">{{doSub}}</p>
</div>
<ol style="flex: 1.4 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{doRows}}" as="d" hint-placeholder-count="4">
<li style="display: flex; gap: 16px; align-items: baseline; padding: 16px 0; border-top: 1px solid #E6E6E3">
<span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #2348E0; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{d.n}}</span>
<span style="font-size: 18px; line-height: 1.4"><strong style="font-weight: 600">{{d.t}}</strong> <span style="color: #5E636D">{{d.b}}</span></span>
</li>
</sc-for>
</ol>
<div id="ways" style="flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding-top: 8px">
<h3 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(24px, 20px + 1vw, 30px); font-weight: 600; line-height: 1.1; letter-spacing: -0.025em">{{optH}}</h3>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<div style="flex: 1 1 300px; min-width: 0; padding: 22px; background: #FAFAF9; border: 1px solid #E6E6E3; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">{{o.t}}</div>
<div style="font-size: 17px; line-height: 1.45; color: #4A4F58">{{o.b}}</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px">
<a href="#book" class="tapme" style="display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 24px; border-radius: 10px; background: #2348E0; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Book a free call</a>
<span style="font-size: 16px; color: #5E636D">{{optNote}}</span>
</div>
</div>
</div>
</section>

<!-- Pains: tap the ones that are true -->
<section style="max-width: 1160px; margin: 0 auto; padding: clamp(48px, 6vw, 84px) clamp(18px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: clamp(24px, 5vw, 72px)">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: clamp(30px, 22px + 2vw, 46px); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em">{{painH}}</h2>
<p style="margin: 0; font-size: 18px; color: #4A4F58">Tap the ones that are true.</p>
<div aria-live="polite" style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 8px">
